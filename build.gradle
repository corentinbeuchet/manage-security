plugins {
	id 'java'
	id 'checkstyle'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'ort.lyon'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

// Correctifs de sécurité signalés par Trivy, pas encore embarqués par Spring Boot :
// à retirer dès que Spring Boot livre ces versions (Dependabot le signalera).
ext['tomcat.version'] = '11.0.25'
ext['jackson-bom.version'] = '3.1.6'

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.named('bootJar') {
	archiveFileName = 'app.jar'
}

checkstyle {
	toolVersion = '14.1.0'   // dernière version : https://checkstyle.org
	maxWarnings = 0
}
