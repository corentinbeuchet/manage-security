name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:

# Évite d'empiler plusieurs runs pour la même branche / PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- CI : exercice 3 ----------
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Construire et vérifier
        run: ./gradlew build
      - name: Publier le livrable
        uses: actions/upload-artifact@v7
        with:
          name: app
          path: build/libs/app.jar
      - name: Publier les rapports (même en cas d'échec)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rapports
          path: build/reports/

  performance:
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Récupérer le livrable construit par le job build
        uses: actions/download-artifact@v8
        with:
          name: app
          path: build/libs
      - name: Démarrer l'application
        run: |
          java -jar build/libs/app.jar &
          for i in $(seq 1 30); do
            curl -fs http://localhost:8080/hello && exit 0
            sleep 2
          done
          echo "L'application n'a pas démarré" && exit 1
      - uses: grafana/setup-k6-action@v1
      - uses: grafana/run-k6-action@v1
        with:
          path: perf/hello.js

  # ---------- Livraison : image Docker ----------
  docker:
    needs: [build, performance]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Récupérer le livrable testé
        uses: actions/download-artifact@v8
        with:
          name: app
          path: build/libs
      - name: Construire l'image
        run: docker build -t demo:${{ github.sha }} .
      - name: Lancer le conteneur
        run: docker run -d --name demo -p 8080:8080 demo:${{ github.sha }}
      - name: Test de fumée
        run: |
          for i in $(seq 1 30); do
            curl -fs http://localhost:8080/hello && exit 0
            sleep 2
          done
          docker logs demo
          exit 1
      # ----- Exercice 5 : scanner l'image, puis l'application en marche -----
      - name: Scanner l'image (Trivy)
        # Épinglé par SHA : les tags de trivy-action ont été détournés en mars 2026
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: demo:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Scanner l'application en marche (ZAP baseline)
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:8080/hello
          allow_issue_writing: false   # rapport en artefact, pas d'issue GitHub

  # ---------- Déploiements ----------
  deploy-test:
    name: Deploy TEST (Pull Request)
    needs: docker
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: ansible-playbook -i ansible/inventory/test.ini ansible/playbook.yml -e image_tag=${{ github.sha }}

  deploy-dev:
    name: Deploy DEV (push sur develop)
    needs: docker
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: ansible-playbook -i ansible/inventory/dev.ini ansible/playbook.yml -e image_tag=${{ github.sha }}

  deploy-prod:
    name: Deploy PROD (push sur main)
    needs: docker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: ansible-playbook -i ansible/inventory/prod.ini ansible/playbook.yml -e image_tag=${{ github.sha }}
